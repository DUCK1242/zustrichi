<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Зустрінемось?</title>
<style>
:root{--bg:#fdf3ee;--card:#ffffff;--text:#2b2230;--muted:#7a6b80;--accent:#e0566f;--accent2:#f2a65a;--border:#ecd9d3;--input:#fffaf7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1622;--card:#271f2f;--text:#f4eaf3;--muted:#b3a4b8;--accent:#ff7a93;--accent2:#f2a65a;--border:#3b3046;--input:#1f1927}}
:root[data-theme="dark"]{--bg:#1c1622;--card:#271f2f;--text:#f4eaf3;--muted:#b3a4b8;--accent:#ff7a93;--accent2:#f2a65a;--border:#3b3046;--input:#1f1927}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:480px;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:28px 24px;box-shadow:0 10px 40px rgba(224,86,111,.12)}
h1{margin:0 0 6px;font-size:1.7rem}
p.sub{margin:0 0 22px;color:var(--muted)}
label{display:block;font-weight:700;margin:16px 0 6px}
input,textarea{width:100%;padding:12px 14px;font:inherit;color:var(--text);background:var(--input);border:1.5px solid var(--border);border-radius:14px;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
.row{display:flex;gap:10px}
.row>div{flex:1;min-width:0}
textarea{resize:vertical;min-height:90px}
button{margin-top:24px;width:100%;padding:14px;font:inherit;font-weight:800;font-size:1.05rem;color:#fff;border:0;border-radius:14px;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2))}
button:active{transform:scale(.98)}
.err{color:var(--accent);font-size:.9rem;margin-top:10px;min-height:1.2em}
.thanks{text-align:center}
.big{font-size:3.5rem;margin-bottom:8px}
.sum{text-align:left;margin:20px 0 0;padding:14px 16px;background:var(--input);border:1px solid var(--border);border-radius:14px;line-height:1.7}
.sum b{color:var(--accent)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="card">
  <form id="form" novalidate>
    <h1>Зустрінемось? 💫</h1>
    <p class="sub">Відповісти на три маленькі запитання.</p>

    <label>Коли тобі буде зручно зустрітися?</label>
    <div class="row">
      <div><input type="date" id="date" aria-label="Дата"></div>
      <div><input type="time" id="time" aria-label="Година"></div>
    </div>

    <label for="place">Де?</label>
    <input type="text" id="place" placeholder="Кав’ярня, парк, кінотеатр…">

    <label for="what">Що хочеш поробити?</label>
    <textarea id="what" placeholder="Прогулятись, піти в кіно, випити кави…"></textarea>

    <div class="err" id="err"></div>
    <button type="submit">Надіслати</button>
  </form>

  <section id="thanks" class="thanks" hidden>
    <div class="big">💖</div>
    <h1>Дякую!</h1>
    <p class="sub">Твою відповідь отримано. Скоро побачимось!</p>
    <div class="sum" id="sum"></div>
  </section>
</main>

<script>
(function(){
  var form=document.getElementById('form'), thanks=document.getElementById('thanks');
  var sum=document.getElementById('sum'), err=document.getElementById('err');
  var answers=null;

  function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

  function render(){
    var isThanks=location.hash==='#thanks' && answers;
    form.hidden=!!isThanks;
    thanks.hidden=!isThanks;
    if(isThanks){
      var d=answers.date.split('-').reverse().join('.');
      sum.innerHTML='<b>Коли:</b> '+esc(d+' о '+answers.time)+'<br><b>Де:</b> '+esc(answers.place)+'<br><b>Що робимо:</b> '+esc(answers.what);
    } else if(location.hash==='#thanks'){
      location.hash='';
    }
  }

  form.addEventListener('submit',function(e){
    e.preventDefault();
    var a={date:document.getElementById('date').value,time:document.getElementById('time').value,
      place:document.getElementById('place').value.trim(),what:document.getElementById('what').value.trim()};
    if(!a.date||!a.time||!a.place||!a.what){err.textContent='Заповни, будь ласка, всі поля 🙂';return;}
    err.textContent='';
    answers=a;
    location.hash='thanks';
    render();
    window.scrollTo(0,0);
  });
  window.addEventListener('hashchange',render);
  render();
})();
</script>
</body>
</html>
